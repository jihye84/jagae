<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자개 붓</title>
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,10,9,.95);color:#efe8e1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#efe8e1;color:#0d0a09">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9c8f86;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 화면 전체가 검은 옻칠판. 도구는 아래 띠(휴대폰·노트북) 또는 왼쪽 세로 띠(가로로 긴 TV). 한 가지 모습(옻칠 어둠)만 쓴다. */
:root {
  --lacquer: #0c0908;
  --panel: rgba(20, 14, 12, .86);
  --panel-line: rgba(233, 222, 210, .12);
  --ink: #efe7de;
  --muted: #9a8d83;
  --cinnabar: #b5432d;      /* 주칠 */
  --pearl: #e8e0ea;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --btn: 48px;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--lacquer); color: var(--ink);
  font-family: var(--font-body); font-size: 14px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.brand {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 18px;
  pointer-events: none; display: flex; align-items: baseline; gap: 10px;
}
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(18px, 2.4vh, 28px); letter-spacing: .14em; color: var(--pearl);
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.brand span { color: var(--muted); font-size: clamp(11px, 1.5vh, 15px); letter-spacing: .04em; }

#hint {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 54px); transform: translateX(-50%);
  padding: 8px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-line);
  color: var(--ink); font-size: clamp(13px, 1.8vh, 18px); pointer-events: none; white-space: nowrap;
  transition: opacity .6s ease;
}
#hint.gone { opacity: 0; }

#bar {
  position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  max-width: calc(100% - 24px); box-sizing: border-box;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px;
  padding: 8px 12px; border-radius: 22px;
  background: var(--panel); border: 1px solid var(--panel-line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.grp { display: flex; gap: 4px; align-items: center; }
.grp + .grp { padding-left: 14px; border-left: 1px solid var(--panel-line); }

#bar button {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  min-width: var(--btn); height: var(--btn); padding: 4px 6px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: inherit; font-size: 12px; cursor: pointer; position: relative;
  transition: background .15s ease, color .15s ease;
}
#bar button:hover { background: rgba(255,255,255,.05); }
#bar button:focus-visible { outline: 2px solid var(--pearl); outline-offset: 1px; }
#bar button svg { width: 24px; height: 24px; flex: none; }
#bar button .lb { line-height: 1; color: var(--muted); }
#bar button[aria-pressed="true"] { background: rgba(232, 224, 234, .1); }
#bar button[aria-pressed="true"] .lb { color: var(--ink); }
#bar button[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 50%; bottom: 2px; width: 14px; height: 3px; margin-left: -7px;
  border-radius: 2px; background: var(--cinnabar);
}

.shell {
  width: 26px; height: 26px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 1px 2px rgba(0,0,0,.6);
}
.shell.s0 { background: conic-gradient(from 40deg, #2f8f96, #3d5fb0, #7a4fa8, #2c9c74, #4aa6b4, #6a4aa0, #2f8f96); }
.shell.s1 { background: conic-gradient(from 10deg, #f1e9ec, #e3dff0, #f3e4dc, #dfeae6, #efe0ea, #f1e9ec); }
.shell.s2 { background: conic-gradient(from 70deg, #9cb76a, #c9b56c, #6fa28a, #b59ac0, #a9c06f, #9cb76a); }

.dot { border-radius: 50%; background: var(--ink); }
#clear.armed .lb { color: var(--cinnabar); }
#clear.armed { background: rgba(181, 67, 45, .16); }

#shapes {
  position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 24px); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--panel-line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#shapes .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
#shapes .tabs::-webkit-scrollbar, #shapes .grid::-webkit-scrollbar { display: none; }
#shapes .tabs button {
  appearance: none; flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--panel-line); background: transparent; color: var(--muted); font: inherit; font-size: 13px;
}
#shapes .tabs button[aria-selected="true"] { background: rgba(232, 224, 234, .14); color: var(--ink); border-color: rgba(232, 224, 234, .35); }
#shapes .tabs button:focus-visible, #shapes .tile:focus-visible { outline: 2px solid var(--pearl); outline-offset: 1px; }
#shapes .grid { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
#shapes .tile {
  appearance: none; flex: none; width: 68px; padding: 6px 2px 5px; border-radius: 14px; cursor: pointer; position: relative;
  border: 1px solid transparent; background: rgba(0, 0, 0, .35); color: var(--muted); font: inherit; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
#shapes .tile canvas { width: 50px; height: 50px; }
#shapes .tile span { line-height: 1.1; white-space: nowrap; }
#shapes .tile:hover { background: rgba(255, 255, 255, .06); }
#shapes .tile[aria-pressed="true"] { background: rgba(232, 224, 234, .12); border-color: rgba(232, 224, 234, .4); color: var(--ink); }
#shapes .tile[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 50%; bottom: -1px; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: var(--cinnabar);
}
#shapes .tip { margin: 0; padding: 0 4px; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  #shapes { width: auto; left: 12px; right: 12px; margin: 0; max-width: none; }
  #shapes .tile { width: 60px; }
  #shapes .tile canvas { width: 44px; height: 44px; }
  #shapes .tip { display: none; }
}
@media (min-width: 1200px) and (min-aspect-ratio: 16/10) {
  #shapes { margin: 0; right: auto; width: auto; max-width: none; top: 50%; transform: translateY(-50%); max-height: calc(100% - 32px); }
  #shapes .tabs { flex-wrap: wrap; max-width: calc(3 * clamp(72px, 8vh, 92px) + 12px); }
  #shapes .grid { display: grid; grid-template-columns: repeat(3, clamp(72px, 8vh, 92px)); overflow-y: auto; }
  #shapes .tile { width: auto; }
  #shapes .tile canvas { width: clamp(50px, 5.6vh, 66px); height: clamp(50px, 5.6vh, 66px); }
  #shapes .tile span { font-size: clamp(11px, 1.3vh, 14px); }
  #shapes .tabs button { font-size: clamp(13px, 1.4vh, 16px); }
}
#reach {
  position: fixed; left: 0; top: 0; pointer-events: none; border-radius: 50%;
  border: 2px dashed rgba(232, 224, 234, .9); background: rgba(232, 224, 234, .08);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .35);
}
#ov { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#nogl {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
  text-align: center; color: var(--ink); font-size: 16px;
}

@media (max-width: 560px) {
  #bar button { min-width: 44px; padding: 3px 2px; font-size: 10px; }
  #bar button svg { width: 21px; height: 21px; }
  #bar button.sz { min-width: 38px; }
  #bar button.sz .lb { display: none; }
  .shell { width: 22px; height: 22px; }
  #bar { gap: 4px 10px; padding: 6px 8px; }
  .grp + .grp { padding-left: 10px; }
  .grp { gap: 2px; }
  :root { --btn: 50px; }
  .brand span { display: none; }
}
@media (max-width: 400px) {
  .grp + .grp { padding-left: 0; border-left: 0; }
}
/* 가로로 긴 화면(교실 TV·전자칠판): 왼쪽 세로 띠 */
@media (min-width: 1200px) and (min-aspect-ratio: 16/10) {
  :root { --btn: clamp(56px, 7vh, 80px); }
  #bar {
    left: 16px; right: auto; margin: 0; width: auto; top: 50%; bottom: auto; transform: translateY(-50%);
    flex-direction: column; flex-wrap: nowrap; padding: 12px 8px; gap: 10px; max-width: none;
  }
  .grp { display: grid; grid-template-columns: repeat(2, var(--btn)); gap: 4px; }
  #bar button { min-width: 0; width: var(--btn); }
  .grp + .grp { padding-left: 0; border-left: 0; padding-top: 10px; border-top: 1px solid var(--panel-line); }
  #bar button { font-size: clamp(12px, 1.4vh, 16px); }
  #bar button svg { width: clamp(24px, 3vh, 34px); height: clamp(24px, 3vh, 34px); }
  .shell { width: clamp(26px, 3.2vh, 36px); height: clamp(26px, 3.2vh, 36px); }
  .brand { left: auto; right: 24px; }
}
</style>
</head>
<body>

<canvas id="gl" aria-label="옻칠 그림판"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="reach" aria-hidden="true" hidden></div>
<div id="shapes" role="group" aria-label="오릴 무늬" hidden></div>
<header class="brand"><h1>자개 붓</h1><span>검은 옻칠 위 나전</span></header>
<div id="hint">손가락이나 마우스로 칠해 보세요</div>

<nav id="bar" aria-label="도구">
  <div class="grp" role="group" aria-label="붓">
    <button data-tool="shard" aria-pressed="true" aria-label="자개 붓">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 18l3-1 2 2-1 3-4-4z"/><path d="M9 19L20 6a1.6 1.6 0 0 0-2.3-2.2L6.5 16"/><path d="M13 4.5l1 1.2M15.5 9l1 .8M11 13l1.2.6" stroke-linecap="round"/></svg>
      <span class="lb">자개 붓</span></button>
    <button data-tool="slab" aria-pressed="false" aria-label="통자개 붓 (한 덩어리)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 17.5c2.5-4 5-6.5 8.5-8s6.5-3.5 8.5-5.5c.8 2-.4 5-3 7.2-3 2.6-6.5 3.3-9 5.3-1.3 1-2.6 1.9-5 1z" opacity=".9"/></svg>
      <span class="lb">통자개</span></button>
    <button data-tool="lasso" aria-pressed="false" aria-label="오려 붙이기: 테두리를 그리면 한 덩어리 자개로 채워져요">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 19l4.5-9 3 4 3.5-8 7 13z" fill="currentColor" fill-opacity=".35"/><path d="M14 6l1.6 3" stroke-dasharray="1.5 1.5"/></svg>
      <span class="lb">오리기</span></button>
    <button data-tool="carve" aria-pressed="false" aria-label="선각: 자개 위에 가는 선을 새겨요">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5l6 6-2 2-6-6z"/><path d="M12.5 5.5L6 12l-1.2 4.2L9 15l6.5-6.5"/><path d="M3 21c2-1.2 3.4-1.4 5-.8s3 .6 5-.6" opacity=".7"/></svg>
      <span class="lb">선각</span></button>
    <button data-tool="strip" aria-pressed="false" aria-label="끊음질">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="butt"><path d="M3 17l4-3M8.6 12.9l3.6-2.4M13.8 9.6l3.6-2.2M19 6.5l2-1.1"/></svg>
      <span class="lb">끊음질</span></button>
    <button data-tool="flake" aria-pressed="false" aria-label="부스러기">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 7l2-1 .5 2z"/><path d="M13 5l2 .5-1.2 1.6z"/><path d="M17 10l2.4.2-1 2z"/><path d="M9 12l1.6-.4.2 1.8z"/><path d="M5 15l2.2.4-1.4 1.6z"/><path d="M13 15l1.6 1.2-2 .6z"/><path d="M17 18l2 .2-.8 1.6z"/><path d="M10 19l1.4-.2-.2 1.4z"/></svg>
      <span class="lb">부스러기</span></button>
  </div>
  <div class="grp" role="group" aria-label="자개">
    <button data-shell="0" aria-pressed="true" aria-label="전복 자개"><span class="shell s0"></span><span class="lb">전복</span></button>
    <button data-shell="128" aria-pressed="false" aria-label="진주 자개"><span class="shell s1"></span><span class="lb">진주</span></button>
    <button data-shell="255" aria-pressed="false" aria-label="야광패 자개"><span class="shell s2"></span><span class="lb">야광패</span></button>
  </div>
  <div class="grp" role="group" aria-label="굵기">
    <button class="sz" data-size="7" aria-pressed="false" aria-label="실처럼 가늘게"><span class="dot" style="width:4px;height:4px"></span><span class="lb">실</span></button>
    <button class="sz" data-size="14" aria-pressed="false" aria-label="가늘게"><span class="dot" style="width:7px;height:7px"></span><span class="lb">가늘게</span></button>
    <button class="sz" data-size="28" aria-pressed="true" aria-label="보통"><span class="dot" style="width:11px;height:11px"></span><span class="lb">보통</span></button>
    <button class="sz" data-size="60" aria-pressed="false" aria-label="굵게"><span class="dot" style="width:16px;height:16px"></span><span class="lb">굵게</span></button>
    <button class="sz" data-size="huge" aria-pressed="false" aria-label="달만큼: 한 번 찍으면 달만 한 원"><span class="dot" style="width:23px;height:23px"></span><span class="lb">달만큼</span></button>
  </div>
  <div class="grp" role="group" aria-label="고치기">
    <button id="undo" aria-label="되돌리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="lb">되돌리기</span></button>
    <button id="clear" aria-label="초기화 (두 번 누르기)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9l8 6M16 9l-8 6" stroke-linecap="round" opacity=".55"/></svg>
      <span class="lb">초기화</span></button>
  </div>
</nav>

<script>
(function () {
'use strict';
const glCanvas = document.getElementById('gl');
const bar = document.getElementById('bar');
const hint = document.getElementById('hint');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 상태 ---------- */
const state = { tool: 'shard', shell: 0, sizeKey: '28', motif: 'cloud' };
/* 아주 굵게: 화면 짧은 변의 약 1/4 — 한 번 찍으면 달만 한 원 */
function sizeNow() { return state.sizeKey === 'huge' ? Math.round(Math.min(cssW, cssH) * 0.22) : +state.sizeKey; }
let DPR = 1, W = 0, H = 0;   // 장치 픽셀
let cssW = 0, cssH = 0;

/* 자료 캔버스: R=자개 덮임, G=결(위상), B=자개 종류 — 셰이더가 이것을 빛나는 자개로 바꾼다 */
let ov = document.getElementById('ov');
let ox = ov.getContext('2d');
const sm = document.createElement('canvas');           // 지금 칠하는 통자개 획이 덮은 자리
const smx = sm.getContext('2d', { willReadFrequently: true });
const tcv = document.createElement('canvas');           // 경계 계산용
const tcx = tcv.getContext('2d', { willReadFrequently: true });
const data = document.createElement('canvas');
const dx = data.getContext('2d', { willReadFrequently: true });

/* ---------- WebGL ---------- */
const gl = glCanvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) {
  const d = document.createElement('div'); d.id = 'nogl';
  d.textContent = '이 기기에서는 자개를 빛나게 그릴 수 없어요. 다른 브라우저(크롬·사파리)로 열어 주세요.';
  document.body.appendChild(d); return;
}
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uData;
uniform vec2 uRes;
uniform float uDpr;
uniform vec2 uLight;
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+17.1;a*=.5;}return v;}
vec3 pal(float t,vec3 a,vec3 b,vec3 d){return a+b*cos(6.28318*(t+d));}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  vec4 dt=texture2D(uData,uv);
  vec2 px=gl_FragCoord.xy/uDpr;

/* ---------- 빛 ---------- */
const light = { x: 0.3, y: 0.4, tx: 0.3, ty: 0.4 };

/* ---------- 포인터 ---------- */
let drawing = false, lastT = 0, lastCss = null, wfSmooth = 1, userDrew = false;
function widthFactor(e, x, y, t) {

    const dt = Math.max(1, t - lastT);
    const sp = Math.hypot(x - lastCss.x, y - lastCss.y) / dt; // css px / ms
    target = state.tool === 'carve' ? clamp(1.2 - sp * 0.25, 0.55, 1.2) : state.tool === 'slab' ? clamp(1.15 - sp * 0.2, 0.6, 1.15) : clamp(1.28 - sp * 0.33, 0.42, 1.28);

  if (st.before && TECH[state.tool]) FILL_R = 254;
  if (state.tool === 'lasso' && state.motif !== 'free') st.motif = state.motif;
  lastT = e.timeStamp; lastCss = { x: e.clientX, y: e.clientY };

/* 부스러기 범위: 마우스를 올리거나 칠하는 동안 흩뿌려질 둥근 범위를 점선으로 보여 준다 */
const reach = document.getElementById('reach');

  if (state.tool !== 'flake' || (e.pointerType !== 'mouse' && !drawing)) { reach.hidden = true; return; }
  const r = sizeNow() * 0.75;

function stop() { if (drawing) { drawing = false; end(); } }

/* 휴대폰 기울이기 → 빛 방향 (버튼 없이 늘 켜짐)
   들고 있는 자세를 기준으로 삼아 조금만 기울여도 빛이 움직이고, 같은 자세로 있으면 천천히 기준을 다시 맞춤 */
let g0 = null, b0 = null;
function onOrient(ev) {
  if (ev.gamma == null || ev.beta == null) return;
  if (g0 === null) { g0 = ev.gamma; b0 = ev.beta; }
  g0 += (ev.gamma - g0) * 0.008; b0 += (ev.beta - b0) * 0.008;
  const x = clamp((ev.gamma - g0) / 18, -1, 1), y = clamp((ev.beta - b0) / 18, -1, 1);
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  const X = x * Math.cos(ang) + y * Math.sin(ang), Y = -x * Math.sin(ang) + y * Math.cos(ang);
  tiltOn = true;
  light.tx = clamp(X * 0.95, -1, 1); light.ty = clamp(-Y * 0.95, -1, 1);
}
if ('DeviceOrientationEvent' in window) {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // 아이폰·아이패드: 처음 화면을 만질 때 한 번 허락을 물어봄
    const ask = () => {
      window.removeEventListener('touchend', ask, true);
      try {
        DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onOrient); }).catch(() => {});
      } catch (_) {}
    };
    window.addEventListener('touchend', ask, true);
  } else {
    window.addEventListener('deviceorientation', onOrient);
  }
}

/* ---------- 첫 화면: 달과 매화 가지 ---------- */
let demo = null;

    const pts2 = [[0.6, 0.82], [0.66, 0.72], [0.7, 0.75], [0.73, 0.69], [0.79, 0.76], [0.84, 0.82]]
      .map(([u, v]) => Object.assign(P(u, v), { wf: 1 }));
    strokes.push({ tool: 'lasso', B: 255, size: 28, ph: 0.2, pts: pts2 });
    // 선각: 산 주름
    const curve = (arr) => {
      const out = [];
      for (let i = 0; i < arr.length - 1; i++) for (let t = 0; t < 1; t += 0.1) {
        const [u0, v0] = arr[i], [u1, v1] = arr[i + 1];
        out.push(Object.assign(P(u0 + (u1 - u0) * t, v0 + (v1 - v0) * t), { wf: 1.1 - 0.5 * ((i + t) / (arr.length - 1)) }));
      }

    };
    [
      [[0.78, 0.5], [0.765, 0.56], [0.75, 0.6], [0.742, 0.66]],
      [[0.785, 0.51], [0.8, 0.57], [0.825, 0.61], [0.84, 0.66]],
      [[0.63, 0.56], [0.62, 0.61], [0.6, 0.66], [0.585, 0.71]],
      [[0.635, 0.57], [0.65, 0.62], [0.665, 0.66]],
      [[0.86, 0.63], [0.875, 0.68], [0.9, 0.72]],

      [[0.92, 0.65], [0.94, 0.7], [0.955, 0.74]]

  }

  strokes.push({ tool: 'shard', B: 255, size: 30 * k0, pts: main });

  [[0.46, 0.45, 1], [0.39, 0.5, 0.8], [0.33, 0.33, 0.9], [0.42, 0.72, 0.85], [0.3, 0.75, 0.7], [0.21, 0.63, 0.8], [0.27, 0.45, 0.65]].forEach(([u, v, k]) => {
    strokes.push({ tool: 'plum', B: 128, size: 40 * k * k0, pts: [Object.assign(P(u, v), { wf: 1 })] });

  strokes.push({ tool: 'lasso', B: 128, size: 28, motif: 'crane', pts: [Object.assign(P(0.5, 0.22), { wf: 1 }), Object.assign(P(0.5 + m * 0.11 / g.w, 0.22 - m * 0.03 / g.h), { wf: 1 })] });

  // 물결 (끊음질, 전복)

}
function demoStep(budget) {
  while (demo && budget > 0) {
    const s = demo.strokes[demo.si];
    if (!s) { demo = null; break; }
    if (demo.pi === 0) { begin(s.tool, s.B, s.size); if (s.ph != null) st.ph = s.ph; if (s.motif) st.motif = s.motif; st.silent = true; }
    const p = s.pts[demo.pi];
    add(p.x, p.y, p.wf);
    demo.pi++; budget--;
    if (demo.pi >= s.pts.length) { end(); demo.si++; demo.pi = 0; }
  }
}
function finishDemo() { if (demo) { demoStep(1e9); demo = null; } }

/* ---------- 그리기 루프 ---------- */
let t0 = performance.now();
function frame(now) {
  if (demo) demoStep(reduceMotion ? 1e9 : 9);
  if (ovDirty && !st) clearOverlay();   // 손을 뗀 뒤 남은 미리보기 정리
  const idle = now - lastPointerLight > 2200;
  if (!tiltOn && idle && !reduceMotion) {
    const t = (now - t0) / 1000;
    light.tx = Math.cos(t * 0.23) * 0.75;
    light.ty = Math.sin(t * 0.31) * 0.6;
  }
  const k = tiltOn ? 0.18 : (idle ? 0.03 : 0.12);
  light.x += (light.tx - light.x) * k;
  light.y += (light.ty - light.y) * k;
  if (dirty) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, data);
    dirty = false;
  }
  gl.uniform2f(uRes, W, H);
  gl.uniform1f(uDpr, DPR);
  gl.uniform2f(uLight, light.x, light.y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

const MOTIF_BY = {}; MOTIFS.forEach(m => { MOTIF_BY[m.key] = m; });
